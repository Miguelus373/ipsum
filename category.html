<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ipsum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <a href="index.html">
        <img src="assets/logo.png" />
      </a>

      <div class="links hidden lg:block">
        <a href="index.html">INICIO</a>
        <a href="#">CATÁLOGO</a>
        <a href="#">NOSOTROS</a>
      </div>
    </nav>

    <div class="flex">
      <div
        class="mt-3 w-1/2 lg:w-1/3 border-r-2 border-pink-500 mt-6 hidden lg:block"
      >
        <h3 class="font-display text-3xl font-bold px-6 py-4 mx5">Filtros</h3>
        <div class="p-6">
          <hr class="h-5 border-t-2" />
          <h4 class="font-display text-xl mb-2">Ubicación</h4>
          <div class="flex justify-between">
            <label>Carabobo</label>
            <input type="checkbox" />
          </div>
          <div class="flex justify-between">
            <label>Caracas</label>
            <input type="checkbox" />
          </div>
          <div class="flex justify-between">
            <label>Mérida</label>
            <input type="checkbox" />
          </div>
          <div class="flex justify-between">
            <label>Aragua</label>
            <input type="checkbox" />
          </div>
          <div class="flex justify-between">
            <label>Lara</label>
            <input type="checkbox" />
          </div>

          <hr class="h-5 border-t-2 mt-4" />
          <h4 class="font-display text-xl mb-2">Condición</h4>
          <div class="flex justify-between">
            <label>Nuevo</label>
            <input type="checkbox" />
          </div>
          <div class="flex justify-between">
            <label>Usado</label>
            <input type="checkbox" />
          </div>

          <hr class="h-5 border-t-2 mt-4" />
          <h4 class="font-display text-xl mb-2">Costo de envío</h4>
          <div class="flex justify-between">
            <label>Grátis</label>
            <input type="checkbox" />
          </div>
        </div>
      </div>
      <div>
        <h1
          id="titulo"
          class="p-7 mx-7 font-display text-5xl font-bold tracking-tighter text-pink-500"
        ></h1>

        <div
          class="flex flex-wrap gap-6 justify-between px-7 mx-7"
          id="item-container"
        ></div>
      </div>
    </div>

    <script>
      const categorias = {
        monitores: {
          titulo: "Monitores",
          items: ["Monitor 100hz", "Monitor 144hz"],
          imagen: "assets/monitor.png",
        },
        teclados: {
          titulo: "Teclados",
          items: ["Teclado mecánico", "Teclado RGB"],
          imagen: "assets/teclado.jpeg",
        },
        audifonos: {
          titulo: "Audífonos",
          items: ["Audífonos bluetooh", "Audífonos"],
          imagen: "assets/audifonos.jpg",
        },
        mouse: {
          titulo: "Mouse",
          items: ["Mouse inalambrico", "Mouse alámbrico"],
          imagen: "assets/mouse.webp",
        },
        accesorios: {
          titulo: "Accesorios",
          items: ["Mouse Pad XL", "Mouse Pad"],
          imagen: "assets/accesorio.avif",
        },
        microfonos: {
          titulo: "Micrófonos",
          items: ["Micrófono Profesional", "Micrófono bluetooh"],
          imagen: "assets/microfono.jpeg",
        },
      };

      const params = new URL(window.location.href).searchParams;
      const categoria = params.get("categoria");

      document.getElementById("titulo").innerText =
        categorias[categoria].titulo;

      const createCard = (titulo, imagen) => {
        return `
          <a href="item.html?tipo=${categoria}" class="flex max-w-md rounded overflow-hidden shadow-xl bg-white hover:scale-105 duration-300 item-card">
            <img src="${imagen}" class="w-1/2 bg-gray-200 rounded"/>
            <div class="w-1/2">
              <div class="px-6 py-4">
                <div class="font-bold text-xl mb-2">${titulo}</div>
                <p class="text-gray-700 text-base">
                  Lorem ipsum dolor sit amet consectetur adipisicing elit.
                </p>
              </div>
              <div class="px-6 pt-4 pb-2 flex justify-end">
                <span class="text-pink-500 font-bold py-2 px-4">${
                  Math.floor(Math.random() * 100) + 1
                }$</span>
                
                <button class="bg-pink-500 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded">
                  Comprar
                </button>
              </div>
            </div>
          </div>
        `;
      };

      const appendCards = () => {
        for (let i = 1; i <= 6; i++) {
          const cardHTML = createCard(
            `${categorias[categoria].items[i % 2 === 0 ? 1 : 0]}`,
            categorias[categoria].imagen
          );
          container.insertAdjacentHTML("beforeend", cardHTML);
        }
      };

      console.log(categorias[categoria].imagen);

      const container = document.getElementById("item-container");
      appendCards();
    </script>
  </body>
</html>
